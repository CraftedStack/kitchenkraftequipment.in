version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - node -v
        # Next.js production builds need devDependencies (Tailwind, TypeScript,
        # PostCSS). Amplify sets NODE_ENV=production, which makes plain `npm ci`
        # skip devDeps — so force them in explicitly.
        - npm ci --include=dev
        - npm ls @tailwindcss/postcss tailwindcss typescript || true
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
